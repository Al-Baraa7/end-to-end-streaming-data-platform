services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
      POSTGRES_DB: ${DB_NAME} 

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

    command: server /data --console-address ":9001"

    volumes:
      - storage:/data

  spark-master:
    build:
      context: .
      target: spark-base
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - storage:/data
    

  spark-worker:
    build:
      context: .
      target: spark-base
    container_name: spark-worker
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker -c 2 -m 2g spark://spark-master:7077
    environment:
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    volumes:
      - storage:/data
      - ./:/home/jovyan/work
    depends_on:
      - spark-master
    

  jupyter:
    build:
      context: .
      target: jupyter
    container_name: jupyter
    hostname: jupyter
    user: "root"
    command: bash -c "chmod -R 777 /data && jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token='' --allow-root"
    ports:
      - "8888:8888"
      - "4040-4045:4040-4045"
    volumes:
      - storage:/data
      - ./:/home/jovyan/work
    depends_on:
      - spark-master
    

volumes:
    storage:          